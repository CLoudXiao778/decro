name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare NSIS toolchain
        shell: pwsh
        run: |
          # GitHub's release CDN occasionally returns 504 for the Tauri NSIS
          # assets. Restore the SHA1-verified toolchain from the repo so a
          # release build does not depend on that download.
          $nsisRoot = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          if (-not (Test-Path (Join-Path $nsisRoot "NSIS.exe"))) {
            if (Test-Path $nsisRoot) { Remove-Item -Recurse -Force $nsisRoot }
            $toolsRoot = Split-Path $nsisRoot -Parent
            New-Item -ItemType Directory -Force -Path $toolsRoot | Out-Null
            Expand-Archive -Path ".github/nsis/nsis-3.13.zip" -DestinationPath $toolsRoot -Force
            Move-Item (Join-Path $toolsRoot "nsis-3.13") $nsisRoot -Force
          }
          $additional = Join-Path $nsisRoot "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $additional | Out-Null
          Copy-Item ".github/nsis/nsis_tauri_utils.dll" (Join-Path $additional "nsis_tauri_utils.dll") -Force
          Write-Host "NSIS toolchain ready."

      - name: Build Tauri bundle
        run: npx tauri build --bundles nsis

      - name: Check installer size
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer produced" }
          $sizeMb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.FullName) ($sizeMb MB)"
          if ($installer.Length -gt 15MB) { throw "Installer exceeds 15 MB budget: $sizeMb MB" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: decro-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
