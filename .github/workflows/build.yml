name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Point npm at the public registry
        shell: pwsh
        run: |
          # npmmirror occasionally returns 504 for tarballs on GitHub runners.
          # The committed lockfile keeps the China mirror for local installs;
          # CI rewrites only its own checkout to the public npm registry.
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          (Get-Content package-lock.json -Raw) -replace 'https://registry\.npmmirror\.com','https://registry.npmjs.org' | Set-Content package-lock.json -NoNewline

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare NSIS toolchain
        shell: pwsh
        run: |
          # GitHub's release CDN occasionally returns 504 for the Tauri NSIS
          # assets. Restore the SHA1-verified toolchain from the repo so a
          # release build does not depend on that download.
          $nsisRoot = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          if (-not (Test-Path (Join-Path $nsisRoot "NSIS.exe"))) {
            if (Test-Path $nsisRoot) { Remove-Item -Recurse -Force $nsisRoot }
            $toolsRoot = Split-Path $nsisRoot -Parent
            New-Item -ItemType Directory -Force -Path $toolsRoot | Out-Null
            Expand-Archive -Path ".github/nsis/nsis-3.13.zip" -DestinationPath $toolsRoot -Force
            Move-Item (Join-Path $toolsRoot "nsis-3.13") $nsisRoot -Force
          }
          $additional = Join-Path $nsisRoot "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $additional | Out-Null
          Copy-Item ".github/nsis/nsis_tauri_utils.dll" (Join-Path $additional "nsis_tauri_utils.dll") -Force
          Write-Host "NSIS toolchain ready."

      - name: Build Tauri bundle
        run: npx tauri build --bundles nsis

      - name: Check installer size
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer produced" }
          $sizeMb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.FullName) ($sizeMb MB)"
          if ($installer.Length -gt 15MB) { throw "Installer exceeds 15 MB budget: $sizeMb MB" }

      - name: Prepare portable package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/decro-desktop.exe"
          if (-not (Test-Path $exe)) { throw "No portable executable produced" }
          if (Test-Path portable) { Remove-Item portable -Recurse -Force }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe "portable/Decro Desktop.exe" -Force
          @"
          Decro Desktop $version portable
          ================================

          1. 解压到一个可写目录，例如 D:\Apps\Decro。
          2. 运行 Decro Desktop.exe。数据会自动写到同目录的 data\ 下：
             - data\netease-auth.bin     登录凭证
             - data\logs\decro.log       日志
             - data\webview\             设置、播放记录、WebView2 缓存
          3. 升级：退出应用，用新版 zip 里的 Decro Desktop.exe 覆盖旧 exe。
             不要删除或覆盖 data\ 目录。
          4. 首次运行会尝试从旧版 AppData 自动迁移登录和设置。
             若失败，可手动复制：
             - %APPDATA%\io.github.cloudxiao778.decrodesktop\netease-auth.bin
               -> <应用目录>\data\netease-auth.bin
             - %LOCALAPPDATA%\io.github.cloudxiao778.decrodesktop\EBWebView\Default\Local Storage
               -> <应用目录>\data\webview\EBWebView\Default\Local Storage
          "@ | Set-Content "portable/README.txt" -Encoding utf8
          Compress-Archive -Path "portable/*" -DestinationPath "Decro.Desktop_${version}_portable_x64.zip" -Force
          Write-Host "Portable: Decro.Desktop_${version}_portable_x64.zip"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: decro-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Decro.Desktop_*_portable_x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Decro.Desktop_*_portable_x64.zip
          generate_release_notes: true
