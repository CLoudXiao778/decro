name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundle
        shell: pwsh
        run: |
          # Tauri downloads the NSIS toolchain from GitHub releases on the first
          # run. A transient 504 should not fail the whole release. If the NSIS
          # zip extracted but the plugin DLL download failed, restore the
          # SHA1-verified Tauri plugin from the repo and retry the bundle.
          $nsisRoot = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx tauri build --bundles nsis
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            if (Test-Path (Join-Path $nsisRoot "NSIS.exe")) {
              $additional = Join-Path $nsisRoot "Plugins\x86-unicode\additional"
              New-Item -ItemType Directory -Force -Path $additional | Out-Null
              Copy-Item ".github/nsis/nsis_tauri_utils.dll" (Join-Path $additional "nsis_tauri_utils.dll") -Force
              Write-Host "Restored cached NSIS plugin DLL."
            }
            Write-Host "Tauri bundle failed (attempt $attempt), retrying in 20s..."
            Start-Sleep -Seconds 20
          }

      - name: Check installer size
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer produced" }
          $sizeMb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.FullName) ($sizeMb MB)"
          if ($installer.Length -gt 15MB) { throw "Installer exceeds 15 MB budget: $sizeMb MB" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: decro-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
