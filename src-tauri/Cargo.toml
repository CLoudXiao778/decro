[package]
name = "decro-desktop"
version = "0.4.2"
description = "Decro — an unofficial desktop recreation of Cirro"
authors = ["Decro contributors"]
edition = "2021"

[lib]
name = "decro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "stream", "blocking"] }
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
