[package]
name = "cirro-desktop"
version = "0.1.0"
description = "An unofficial desktop recreation of Cirro"
authors = ["Cirro Desktop contributors"]
edition = "2021"

[lib]
name = "cirro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
